# imi.ge — Cloudflare Plus + SSL + FULL STRIX
# IMPORTANT: _next/static MUST be served by nginx (not Node) — otherwise 500 + text/plain
#
# sudo cp nginx-imi.ge.conf /etc/nginx/sites-available/imi.ge
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name imi.ge www.imi.ge;
    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$server_name$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name imi.ge www.imi.ge;

    ssl_certificate /etc/letsencrypt/live/imi.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imi.ge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (shared snippet — must repeat in each location with add_header)
    # Because Nginx ignores parent add_header when a child block has its own

    # 1. Static chunks — FIRST, before proxy. Nginx serves directly = correct MIME
    location /_next/static/ {
        alias /home/fullimi/imi_extracted/frontend/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        gzip_static on;
    }

    # 1a. Images via Next.js (optimized) — cache for 1 day
    location /_next/image {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # 1b. Fonts — preloaded, immutable cache (^~ ensures prefix match wins)
    location ^~ /fonts/ {
        alias /home/fullimi/imi_extracted/frontend/public/fonts/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 2. favicon
    location = /favicon.ico {
        alias /home/fullimi/imi_extracted/frontend/public/favicon.svg;
        add_header Content-Type "image/svg+xml";
        add_header Cache-Control "public, max-age=604800";
    }

    # 2b. manifest — cache 1 day
    location = /manifest.json {
        alias /home/fullimi/imi_extracted/frontend/public/manifest.json;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/manifest+json";
    }

    # 3. All else → Next.js
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Font preloads are in <head> via layout.tsx (Link headers conflict with upstream Link header)
    }
}
